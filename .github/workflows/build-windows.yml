name: Build Windows app

on:
  push:
    branches: [main, claude/valorant-aim-trainer-k55kym, claude/valorant-aim-overlay-yen0za]
  workflow_dispatch:

permissions:
  contents: write

env:
  # 파서는 패치마다 바뀔 수 있어 검증한 커밋으로 고정
  PARSER_COMMIT: 8b7afcbb98bc4f8d4c342aef8242b142568624ca

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # 리플레이 해석기: ValorantReplayParser (MIT) 의 CliReader 를 Windows 단일 실행파일로 빌드
      - name: Checkout ValorantReplayParser
        run: |
          git clone https://github.com/michel-giehl/ValorantReplayParser parser-src
          git -C parser-src checkout ${{ env.PARSER_COMMIT }}
          # 매니페스트에 맵(레벨) 이름 추가
          git -C parser-src apply ../tools/parser-patches/manifest-level-names.patch

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: parser-src/global.json

      - name: Build replay parser (win-x64)
        run: |
          dotnet publish parser-src/src/CliReader/CliReader.csproj -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o desktop/parser
          cp parser-src/LICENSE desktop/parser/LICENSE-ValorantReplayParser.txt
          ls -la desktop/parser

      - run: npm run build:win

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ValoAimTrainer-win-x64
          path: desktop/out/ValoAimTrainer-win32-x64

      - name: Publish release (다운로드 페이지)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v0.1.0-build${{ github.run_number }}
          name: 발로 에임 트레이너 (Windows) build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **ValoAimTrainer-win-x64.zip** 을 내려받아 압축을 풀고 `ValoAimTrainer.exe` 를 실행하세요.
            처음 실행 시 Windows 보호 창이 뜨면 "추가 정보 → 실행" 을 누르면 됩니다.

            설치 없이 브라우저로 하려면 **valo-aim-trainer.html** 을 내려받아 더블클릭하세요.
          files: |
            desktop/out/ValoAimTrainer-win-x64.zip
            dist/valo-aim-trainer.html
